# Free-tier Supabase projects get paused after ~7 days with no activity (data is kept, but the app
# is down until someone hits "Restore" in the dashboard). This pings the live project every 3 days
# with real database traffic so that never happens.
#
# Uses the same repo secrets as "Deploy Supabase": SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# Run it by hand any time: GitHub -> Actions -> "Keep Supabase awake" -> Run workflow.
#
# Heads up: GitHub turns off scheduled workflows in public repos after 60 days with no commits.
# If that happens, GitHub emails you; click "Enable workflow" on the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 14 */3 * *'   # every 3 days, ~9-10am Eastern
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF repo secret"; exit 1
          fi

      # A real query against Postgres. Read-only, touches no app tables.
      - name: Query the database
        run: |
          out=$(curl -fsS --retry 3 --retry-delay 10 -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"select now() as pinged_at, (select count(*) from pg_stat_activity) as connections"}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query") || {
            echo "::error::Database query failed. If the project is already paused, restore it in the Supabase dashboard."; exit 1; }
          echo "DB answered: $out"

      # Also go through the public API gateway (REST + Auth), the same path the app uses.
      - name: Hit the public API
        run: |
          key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            | jq -r 'map(select(.name=="anon" or .type=="publishable"))[0].api_key // empty')
          if [ -z "$key" ]; then echo "::warning::Couldn't read the anon key, skipping API ping"; exit 0; fi
          echo "::add-mask::$key"
          base="https://$PROJECT_REF.supabase.co"
          auth=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $key" "$base/auth/v1/health")
          rest=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $key" -H "Authorization: Bearer $key" "$base/rest/v1/")
          echo "auth/v1/health -> $auth, rest/v1 -> $rest"
          [ "$auth" = 200 ] || echo "::warning::Auth health returned $auth"
