<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Send to Oasis</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header><img src="icons/icon-32.png" alt="" width="20" height="20" /> <strong>Send to Oasis</strong></header>
  <p id="msg" role="status">Open a YouTube video, then send it to the Oasis lesson builder.</p>
  <label class="check"><input type="checkbox" id="transcript" checked /> Bring the transcript too</label>
  <button id="send" class="primary">Send this video</button>
  <p class="fine">Reads only the video you have open. Nothing is sent until Oasis opens, and nothing is saved until you press Save there.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
